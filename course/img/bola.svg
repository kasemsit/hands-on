<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 480" width="100%" style="max-width:830px;height:auto" role="img" aria-label="ความต่างระหว่าง authentication กับ authorization และช่องโหว่ BOLA">
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
  .ink{fill:#1f2328}.muted{fill:#656d76}
  .strip{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
  .gate{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}.gatetx{fill:#0a4d8c}
  .bad{fill:#ffebe9;stroke:#cf222e;stroke-width:1.5}.badtx{fill:#a40e26}
  .ok{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}.oktx{fill:#0f5323}
  .a{stroke:#8c959f;stroke-width:2;fill:none;marker-end:url(#a)}
  .ab{stroke:#cf222e;stroke-width:2;fill:none;marker-end:url(#r)}
  .ag{stroke:#1a7f37;stroke-width:2;fill:none;marker-end:url(#g)}
  .fa{fill:#8c959f}.fr{fill:#cf222e}.fg{fill:#1a7f37}
  @media (prefers-color-scheme:dark){
    .ink{fill:#e6edf3}.muted{fill:#9198a1}
    .strip{fill:#161b22;stroke:#3d444d}
    .gate{fill:#0c2d6b;stroke:#58a6ff}.gatetx{fill:#79c0ff}
    .bad{fill:#2d0f11;stroke:#f85149}.badtx{fill:#ff7b72}
    .ok{fill:#0f2916;stroke:#2ea043}.oktx{fill:#3fb950}
    .a{stroke:#6e7681}.ab{stroke:#f85149}.ag{stroke:#2ea043}
    .fa{fill:#6e7681}.fr{fill:#f85149}.fg{fill:#2ea043}
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fa"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fr"/></marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg"/></marker>
</defs>

<text x="24" y="26" class="ink" font-size="14" font-weight="700">ด่านที่ 1 ผ่านไม่ได้แปลว่าด่านที่ 2 ผ่าน — และหลายระบบมีแค่ด่านเดียว</text>

<!-- request -->
<rect x="24" y="46" width="182" height="80" rx="8" class="strip"/>
<text x="40" y="67" class="ink" font-size="12" font-weight="600">myuser ยิงเข้ามา</text>
<text x="40" y="90" class="mono ink">GET /orders/1002</text>
<text x="40" y="110" class="mono ink">Bearer &lt;token ที่ถูกต้อง&gt;</text>

<path d="M210 86 L262 86" class="a"/>

<!-- gate 1 -->
<rect x="266" y="40" width="176" height="92" rx="8" class="gate"/>
<text x="354" y="63" text-anchor="middle" class="gatetx" font-size="12.5" font-weight="700">ด่านที่ 1</text>
<text x="354" y="82" text-anchor="middle" class="gatetx" font-size="12.5" font-weight="600">Authentication</text>
<text x="354" y="102" text-anchor="middle" class="gatetx" font-size="11.5">“คุณเป็นใคร?”</text>
<text x="354" y="121" text-anchor="middle" class="oktx" font-size="11.5" font-weight="600">✓ token ถูกต้อง = myuser</text>

<path d="M446 86 L498 86" class="a"/>

<!-- gate 2 -->
<rect x="502" y="40" width="176" height="92" rx="8" class="gate"/>
<text x="590" y="63" text-anchor="middle" class="gatetx" font-size="12.5" font-weight="700">ด่านที่ 2</text>
<text x="590" y="82" text-anchor="middle" class="gatetx" font-size="12.5" font-weight="600">Authorization</text>
<text x="590" y="102" text-anchor="middle" class="gatetx" font-size="11.5">“order 1002 เป็นของคุณ?”</text>
<text x="590" y="121" text-anchor="middle" class="badtx" font-size="11.5" font-weight="600">← ด่านนี้มักถูกลืม</text>

<rect x="694" y="40" width="112" height="92" rx="8" class="strip"/>
<text x="750" y="66" text-anchor="middle" class="ink" font-size="11.5" font-weight="600">order 1002</text>
<text x="750" y="88" text-anchor="middle" class="muted" font-size="11">เจ้าของคือ</text>
<text x="750" y="106" text-anchor="middle" class="badtx" font-size="12" font-weight="600">otheruser</text>
<text x="750" y="124" text-anchor="middle" class="muted" font-size="10.5">ไม่ใช่ myuser!</text>

<line x1="24" y1="152" x2="806" y2="152" stroke="#d0d7de" stroke-dasharray="4 4"/>

<!-- v1 -->
<rect x="24" y="172" width="380" height="164" rx="8" class="bad"/>
<text x="44" y="196" class="badtx" font-size="13" font-weight="700">✗ v1 — มีแค่ด่านที่ 1 (BOLA)</text>
<text x="44" y="220" class="mono badtx">order = db.get(order_id)</text>
<text x="44" y="238" class="mono badtx">if not order: raise NotFound()</text>
<text x="44" y="256" class="mono badtx">return order        # ให้เลย</text>
<rect x="44" y="270" width="340" height="52" rx="6" class="strip"/>
<text x="58" y="290" class="badtx" font-size="11.5" font-weight="600">ผลลัพธ์: ข้อมูลของ otheruser รั่ว</text>
<text x="58" y="310" class="muted" font-size="11">ผู้โจมตีไล่ id 1001→9999 ดูดฐานลูกค้าได้ทั้งหมด</text>

<!-- v2 -->
<rect x="426" y="172" width="380" height="164" rx="8" class="ok"/>
<text x="446" y="196" class="oktx" font-size="13" font-weight="700">✓ v2 — ตรวจความเป็นเจ้าของด้วย</text>
<text x="446" y="220" class="mono oktx">order = db.get(order_id)</text>
<text x="446" y="238" class="mono oktx">if not order or order.owner != user:</text>
<text x="446" y="256" class="mono oktx">    raise NotFound()   # ← 404 ไม่ใช่ 403</text>
<rect x="446" y="270" width="340" height="52" rx="6" class="strip"/>
<text x="460" y="290" class="oktx" font-size="11.5" font-weight="600">ทำไมตอบ 404 ไม่ใช่ 403</text>
<text x="460" y="310" class="muted" font-size="11">403 = ยอมรับว่า order 1002 มีอยู่จริง → ผู้โจมตีไล่นับได้</text>

<!-- better -->
<rect x="24" y="356" width="782" height="106" rx="8" class="strip"/>
<text x="44" y="380" class="ink" font-size="12.5" font-weight="700">ทนทานกว่านั้น — ใส่เงื่อนไขเจ้าของลงไปใน query ตั้งแต่แรก</text>
<text x="44" y="404" class="muted" font-size="11.5">การ "ดึงมาก่อนแล้วค่อยเช็ค" ยังลืมได้ แต่ถ้า query ดึงเฉพาะของเขาอยู่แล้ว ก็ไม่มีอะไรให้ลืม</text>
<text x="44" y="430" class="mono oktx">SELECT * FROM orders WHERE id = ? AND user_id = ?</text>
<text x="44" y="452" class="muted" font-size="11">หลักการ: ทำให้ “ทางที่ถูก” เป็นทางที่ง่ายที่สุด — ถ้าความปลอดภัยต้องพึ่งความจำของคนเขียนโค้ด สักวันจะมีคนลืม</text>
</svg>

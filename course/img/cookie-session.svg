<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 540" width="100%" style="max-width:830px;height:auto" role="img" aria-label="ลำดับการทำงานของ cookie และ session: server ตั้ง cookie sid แล้ว client ส่งกลับมาทุกครั้ง ข้อมูลจริงเก็บอยู่ฝั่ง server">
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
  .ink{fill:#1f2328}.muted{fill:#656d76}
  .card{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5}
  .strip{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
  .life{stroke:#d0d7de;stroke-width:1.5;stroke-dasharray:4 4}
  .req{stroke:#0969da;stroke-width:2;fill:none;marker-end:url(#a1)}
  .res{stroke:#8250df;stroke-width:2;fill:none;marker-end:url(#a2)}
  .f1{fill:#0969da}.f2{fill:#8250df}
  .lreq{fill:#0969da}.lres{fill:#8250df}
  .note{fill:#fff8c5;stroke:#d4a72c;stroke-width:1.5}
  .mem{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
  .memtx{fill:#0f5323}
  @media (prefers-color-scheme:dark){
    .ink{fill:#e6edf3}.muted{fill:#9198a1}
    .card{fill:#0d1117;stroke:#3d444d}.strip{fill:#161b22;stroke:#3d444d}
    .life{stroke:#3d444d}
    .req{stroke:#58a6ff}.res{stroke:#bc8cff}.f1{fill:#58a6ff}.f2{fill:#bc8cff}
    .lreq{fill:#58a6ff}.lres{fill:#bc8cff}
    .note{fill:#3d2c00;stroke:#9e6a03}
    .mem{fill:#0f2916;stroke:#2ea043}.memtx{fill:#3fb950}
  }
</style>
<defs>
  <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="f1"/></marker>
  <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="f2"/></marker>
</defs>

<!-- lifelines -->
<rect x="40" y="20" width="170" height="34" rx="6" class="strip"/>
<text x="125" y="42" text-anchor="middle" class="ink" font-size="13" font-weight="600">Client (curl / เบราว์เซอร์)</text>
<line x1="125" y1="54" x2="125" y2="470" class="life"/>

<rect x="420" y="20" width="140" height="34" rx="6" class="strip"/>
<text x="490" y="42" text-anchor="middle" class="ink" font-size="13" font-weight="600">Server</text>
<line x1="490" y1="54" x2="490" y2="470" class="life"/>

<!-- server memory -->
<rect x="600" y="86" width="212" height="92" rx="8" class="mem"/>
<text x="616" y="106" class="memtx" font-size="12" font-weight="600">หน่วยความจำของ server</text>
<text x="616" y="127" class="mono memtx">SESSIONS = {</text>
<text x="616" y="144" class="mono memtx">  "abc123": {</text>
<text x="616" y="160" class="mono memtx">    "user": "myuser" }}</text>
<text x="600" y="196" class="muted" font-size="11">ข้อมูลจริงอยู่ที่นี่ ไม่ได้อยู่ใน cookie</text>

<!-- step 1 -->
<text x="40" y="84" class="muted" font-size="11">①</text>
<path d="M125 96 L484 96" class="req"/>
<text x="140" y="90" class="mono lreq">GET /login</text>

<!-- server action -->
<rect x="470" y="110" width="40" height="26" rx="4" class="strip"/>
<text x="516" y="127" class="muted" font-size="11">สร้าง session ใหม่ เก็บลงหน่วยความจำ →</text>

<!-- step 2 -->
<text x="40" y="176" class="muted" font-size="11">②</text>
<path d="M490 188 L131 188" class="res"/>
<text x="140" y="182" class="mono lres">200 OK + Set-Cookie: sid=abc123</text>

<!-- client stores -->
<rect x="40" y="204" width="176" height="52" rx="6" class="note"/>
<text x="52" y="222" class="ink" font-size="11.5" font-weight="600">client เก็บลง cookie jar</text>
<text x="52" y="240" class="mono ink" font-size="11">curl -c cookies.txt</text>

<!-- step 3 -->
<text x="40" y="292" class="muted" font-size="11">③</text>
<path d="M125 304 L484 304" class="req"/>
<text x="140" y="298" class="mono lreq">GET /dashboard + Cookie: sid=abc123</text>
<text x="140" y="322" class="muted" font-size="11">curl -b cookies.txt — ต้องส่งกลับไปเองทุกครั้ง</text>

<!-- server lookup -->
<path d="M600 316 L516 316" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
<text x="606" y="320" class="memtx" font-size="11">ค้นหา "abc123" → myuser</text>

<!-- step 4 -->
<text x="40" y="366" class="muted" font-size="11">④</text>
<path d="M490 378 L131 378" class="res"/>
<text x="140" y="372" class="mono lres">200 OK — "สวัสดี myuser"</text>

<!-- big idea -->
<rect x="40" y="410" width="740" height="46" rx="8" class="note"/>
<text x="58" y="430" class="ink" font-size="12.5" font-weight="600">cookie คือ "บัตรคิว" ไม่ใช่ "ข้อมูล"</text>
<text x="58" y="448" class="ink" font-size="12">ตัว cookie บอกแค่ว่า "ฉันคือคนที่ถือบัตรใบนี้" — ใครแก้ค่าใน cookie ก็ได้ ดังนั้นห้ามเก็บอะไรที่ต้องเชื่อถือไว้ในนั้น</text>

<!-- curl mapping -->
<rect x="40" y="474" width="360" height="46" rx="8" class="strip"/>
<text x="56" y="493" class="mono ink"><tspan class="lres" font-weight="700">-c</tspan> = Cookie jar → เขียนลงไฟล์ (ขั้น ②)</text>
<text x="56" y="511" class="mono ink"><tspan class="lreq" font-weight="700">-b</tspan> = Bring → อ่านจากไฟล์ส่งไป (ขั้น ③)</text>

<rect x="420" y="474" width="360" height="46" rx="8" class="strip"/>
<text x="436" y="493" class="ink" font-size="12" font-weight="600">ใช้คู่กันเสมอ: -b jar -c jar</text>
<text x="436" y="511" class="muted" font-size="11.5">ไม่งั้น cookie ที่ server อัปเดตระหว่างทางจะหายไป</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 470" width="100%" style="max-width:830px;height:auto" role="img" aria-label="การโจมตีแบบ CSRF และการป้องกันด้วย CSRF token">
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
  .ink{fill:#1f2328}.muted{fill:#656d76}
  .card{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5}
  .strip{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
  .bad{fill:#ffebe9;stroke:#cf222e;stroke-width:1.5}.badtx{fill:#a40e26}
  .good{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}.goodtx{fill:#0f5323}
  .abad{stroke:#cf222e;stroke-width:2;fill:none;marker-end:url(#ab)}
  .agood{stroke:#1a7f37;stroke-width:2;fill:none;marker-end:url(#ag)}
  .aneutral{stroke:#8c959f;stroke-width:2;fill:none;marker-end:url(#an)}
  .fb{fill:#cf222e}.fg{fill:#1a7f37}.fn{fill:#8c959f}
  @media (prefers-color-scheme:dark){
    .ink{fill:#e6edf3}.muted{fill:#9198a1}
    .card{fill:#0d1117;stroke:#3d444d}.strip{fill:#161b22;stroke:#3d444d}
    .bad{fill:#2d0f11;stroke:#f85149}.badtx{fill:#ff7b72}
    .good{fill:#0f2916;stroke:#2ea043}.goodtx{fill:#3fb950}
    .abad{stroke:#f85149}.agood{stroke:#2ea043}.aneutral{stroke:#6e7681}
    .fb{fill:#f85149}.fg{fill:#2ea043}.fn{fill:#6e7681}
  }
</style>
<defs>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fb"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg"/></marker>
  <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fn"/></marker>
</defs>

<text x="24" y="26" class="badtx" font-size="14" font-weight="700">✗ ไม่มี CSRF token — เว็บร้ายสั่งงานแทนคุณได้</text>

<!-- attacker site -->
<rect x="24" y="42" width="200" height="82" rx="8" class="bad"/>
<text x="40" y="62" class="badtx" font-size="12.5" font-weight="600">evil.com</text>
<text x="40" y="81" class="mono badtx">&lt;form action=</text>
<text x="40" y="96" class="mono badtx">  "bank.com/transfer"&gt;</text>
<text x="40" y="113" class="mono badtx">auto-submit ทันที</text>

<!-- browser -->
<rect x="290" y="42" width="180" height="82" rx="8" class="strip"/>
<text x="380" y="63" text-anchor="middle" class="ink" font-size="12.5" font-weight="600">เบราว์เซอร์ของคุณ</text>
<text x="380" y="83" text-anchor="middle" class="muted" font-size="11.5">มี cookie ของ bank.com</text>
<text x="380" y="100" text-anchor="middle" class="muted" font-size="11.5">อยู่แล้วจากที่ login ไว้</text>
<text x="380" y="117" text-anchor="middle" class="badtx" font-size="11.5">→ แนบให้อัตโนมัติ!</text>

<!-- bank -->
<rect x="536" y="42" width="180" height="82" rx="8" class="bad"/>
<text x="626" y="63" text-anchor="middle" class="badtx" font-size="12.5" font-weight="600">bank.com</text>
<text x="626" y="84" text-anchor="middle" class="badtx" font-size="11.5">เห็น cookie ถูกต้อง</text>
<text x="626" y="103" text-anchor="middle" class="badtx" font-size="11.5">→ คิดว่าคุณสั่งเอง</text>
<text x="626" y="120" text-anchor="middle" class="badtx" font-size="12" font-weight="600">โอนเงินสำเร็จ 💸</text>

<path d="M226 82 L286 82" class="abad"/>
<path d="M472 82 L532 82" class="abad"/>
<text x="482" y="76" class="mono badtx" font-size="10.5">+ Cookie</text>

<line x1="24" y1="146" x2="806" y2="146" stroke="#d0d7de" stroke-dasharray="4 4"/>

<text x="24" y="176" class="goodtx" font-size="14" font-weight="700">✓ มี CSRF token — เว็บร้ายปลอมไม่ได้</text>

<!-- step 1: get form -->
<rect x="24" y="194" width="230" height="96" rx="8" class="good"/>
<text x="40" y="214" class="goodtx" font-size="12.5" font-weight="600">① โหลดหน้า form จาก bank.com</text>
<text x="40" y="236" class="mono goodtx">Set-Cookie: sid=abc</text>
<text x="40" y="253" class="mono goodtx">&lt;input type="hidden"</text>
<text x="40" y="269" class="mono goodtx">  name="csrf_token"</text>
<text x="40" y="284" class="mono goodtx">  value="xyz"&gt;</text>

<!-- server memory -->
<rect x="290" y="194" width="230" height="96" rx="8" class="strip"/>
<text x="306" y="214" class="ink" font-size="12.5" font-weight="600">server จำคู่นี้ไว้</text>
<text x="306" y="240" class="mono ink">session abc ↔ token xyz</text>
<text x="306" y="266" class="muted" font-size="11">token สุ่มใหม่ทุกครั้งที่โหลดหน้า</text>
<text x="306" y="283" class="muted" font-size="11">และผูกกับ session นั้นเท่านั้น</text>

<!-- key point -->
<rect x="556" y="194" width="250" height="96" rx="8" class="good"/>
<text x="572" y="214" class="goodtx" font-size="12.5" font-weight="600">ทำไม evil.com ปลอมไม่ได้</text>
<text x="572" y="238" class="goodtx" font-size="11.5">same-origin policy ห้ามเว็บหนึ่ง</text>
<text x="572" y="255" class="goodtx" font-size="11.5">อ่านเนื้อหาของอีกเว็บ</text>
<text x="572" y="277" class="goodtx" font-size="11.5">→ อ่านค่า xyz ไม่ได้ = เดาไม่ถูก</text>

<path d="M258 240 L286 240" class="agood"/>

<!-- verdicts -->
<rect x="24" y="308" width="782" height="34" rx="6" class="good"/>
<text x="40" y="330" class="mono goodtx">POST /transfer   Cookie: sid=abc   +   csrf_token=xyz      ✓  ตรงกัน → ผ่าน</text>

<rect x="24" y="350" width="782" height="34" rx="6" class="bad"/>
<text x="40" y="372" class="mono badtx">POST /transfer   Cookie: sid=abc   +   csrf_token=(เดา)    ✗  ไม่ตรง → 403</text>

<!-- curl note -->
<rect x="24" y="400" width="782" height="56" rx="8" class="strip"/>
<text x="40" y="421" class="ink" font-size="12.5" font-weight="600">สิ่งที่เรื่องนี้แปลว่าอะไรสำหรับ curl</text>
<text x="40" y="441" class="ink" font-size="12">ต้องยิงสองครั้งเสมอ — ครั้งแรกโหลดหน้า form เพื่อเก็บ <tspan class="mono">cookie</tspan> + <tspan class="mono">csrf_token</tspan> ครั้งที่สองจึง submit โดยส่งทั้งคู่ไปด้วยกัน</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 470" width="100%" style="max-width:830px;height:auto" role="img" aria-label="สามชั้นของการเข้ารหัสข้อความ: ตัวอักษร ไปเป็น UTF-8 bytes ไปเป็น percent-encoding">
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
  .ink{fill:#1f2328}.muted{fill:#656d76}
  .strip{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
  .l1{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}.t1{fill:#0a4d8c}
  .l2{fill:#fbefff;stroke:#8250df;stroke-width:1.5}.t2{fill:#6639ba}
  .l3{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}.t3{fill:#0f5323}
  .arrow{stroke:#8c959f;stroke-width:2.5;fill:none;marker-end:url(#a)}
  .fa{fill:#8c959f}
  .warn{fill:#fff8c5;stroke:#d4a72c;stroke-width:1.5}
  @media (prefers-color-scheme:dark){
    .ink{fill:#e6edf3}.muted{fill:#9198a1}
    .strip{fill:#161b22;stroke:#3d444d}
    .l1{fill:#0c2d6b;stroke:#58a6ff}.t1{fill:#79c0ff}
    .l2{fill:#2b1a4d;stroke:#bc8cff}.t2{fill:#d2a8ff}
    .l3{fill:#0f2916;stroke:#2ea043}.t3{fill:#3fb950}
    .arrow{stroke:#6e7681}.fa{fill:#6e7681}
    .warn{fill:#3d2c00;stroke:#9e6a03}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fa"/></marker></defs>

<text x="24" y="28" class="ink" font-size="14" font-weight="700">คำว่า “หนังสือ” เดินทางจากคีย์บอร์ดไปถึง server อย่างไร</text>

<!-- layer 1 -->
<rect x="24" y="46" width="500" height="72" rx="8" class="l1"/>
<text x="42" y="68" class="t1" font-size="12" font-weight="600">ชั้นที่ 1 · ตัวอักษรที่มนุษย์อ่าน</text>
<text x="42" y="98" class="mono t1" font-size="20">หนังสือ</text>
<text x="300" y="98" class="t1" font-size="12">7 ตัวอักษร</text>
<rect x="548" y="46" width="258" height="72" rx="8" class="strip"/>
<text x="564" y="68" class="ink" font-size="11.5" font-weight="600">นี่คือสิ่งที่คุณพิมพ์</text>
<text x="564" y="88" class="muted" font-size="11">คอมพิวเตอร์เก็บตัวอักษรตรง ๆ ไม่ได้</text>
<text x="564" y="105" class="muted" font-size="11">ต้องแปลงเป็นตัวเลขก่อน</text>

<path d="M274 122 L274 148" class="arrow"/>
<text x="288" y="140" class="muted" font-size="11.5">แปลงด้วย <tspan font-weight="600" class="ink">UTF-8</tspan> (character encoding)</text>

<!-- layer 2 -->
<rect x="24" y="156" width="500" height="86" rx="8" class="l2"/>
<text x="42" y="178" class="t2" font-size="12" font-weight="600">ชั้นที่ 2 · ลำดับของ byte</text>
<text x="42" y="204" class="mono t2" font-size="13">E0 B8 AB  E0 B8 99  E0 B8 B1  E0 B8 87 ...</text>
<text x="42" y="228" class="t2" font-size="11.5">ภาษาไทยใช้ 3 byte ต่อ 1 ตัวอักษร → 7 ตัว = 21 byte</text>
<rect x="548" y="156" width="258" height="86" rx="8" class="strip"/>
<text x="564" y="178" class="ink" font-size="11.5" font-weight="600">จุดที่ภาษาไทยกลายเป็น à¸«à¸™</text>
<text x="564" y="198" class="muted" font-size="11">ถ้าอีกฝั่งอ่าน byte ชุดนี้</text>
<text x="564" y="215" class="muted" font-size="11">ด้วย encoding อื่น (เช่น latin-1)</text>
<text x="564" y="232" class="muted" font-size="11">จะแปลได้ตัวอักษรมั่ว = mojibake</text>

<path d="M274 246 L274 272" class="arrow"/>
<text x="288" y="264" class="muted" font-size="11.5">แปลงด้วย <tspan font-weight="600" class="ink">percent-encoding</tspan> (URL encoding)</text>

<!-- layer 3 -->
<rect x="24" y="280" width="500" height="86" rx="8" class="l3"/>
<text x="42" y="302" class="t3" font-size="12" font-weight="600">ชั้นที่ 3 · ข้อความที่ปลอดภัยใน URL</text>
<text x="42" y="328" class="mono t3" font-size="13">%E0%B8%AB%E0%B8%99%E0%B8%B1%E0%B8%87...</text>
<text x="42" y="352" class="t3" font-size="11.5">แต่ละ byte กลายเป็น % ตามด้วยเลขฐาน 16 สองหลัก</text>
<rect x="548" y="280" width="258" height="86" rx="8" class="strip"/>
<text x="564" y="302" class="ink" font-size="11.5" font-weight="600">นี่คือสิ่งที่เดินทางบนสายจริง</text>
<text x="564" y="322" class="muted" font-size="11">curl ทำขั้นนี้ให้เมื่อคุณใช้</text>
<text x="564" y="341" class="mono ink" font-size="11.5">--data-urlencode</text>
<text x="564" y="358" class="muted" font-size="11">ถ้าใช้ -d เฉย ๆ มันจะไม่ทำให้</text>

<!-- key insight -->
<rect x="24" y="382" width="782" height="72" rx="8" class="warn"/>
<text x="44" y="404" class="ink" font-size="12.5" font-weight="600">กุญแจสำคัญของทั้งบท</text>
<text x="44" y="424" class="ink" font-size="12">percent-encoding ทำงานกับ <tspan font-weight="700">byte</tspan> ไม่ใช่กับ <tspan font-weight="700">ตัวอักษร</tspan> — จึงต้องรู้ชั้นที่ 2 ก่อนเสมอ</text>
<text x="44" y="444" class="ink" font-size="12">นี่คือเหตุผลว่าทำไม “ก” ตัวเดียวถึงกลายเป็น <tspan class="mono">%E0%B8%81</tspan> ยาวถึงสามชุด — เพราะมันคือ 3 byte</text>
</svg>

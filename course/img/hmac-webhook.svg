<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 450" width="100%" style="max-width:830px;height:auto" role="img" aria-label="การเซ็นและตรวจ HMAC signature ของ webhook">
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
  .ink{fill:#1f2328}.muted{fill:#656d76}
  .strip{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
  .send{fill:#fbefff;stroke:#8250df;stroke-width:1.5}.sendtx{fill:#6639ba}
  .recv{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}.recvtx{fill:#0a4d8c}
  .key{fill:#fff8c5;stroke:#d4a72c;stroke-width:1.5}
  .bad{fill:#ffebe9;stroke:#cf222e;stroke-width:1.5}.badtx{fill:#a40e26}
  .ok{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}.oktx{fill:#0f5323}
  .a{stroke:#8c959f;stroke-width:2;fill:none;marker-end:url(#a)}.fa{fill:#8c959f}
  @media (prefers-color-scheme:dark){
    .ink{fill:#e6edf3}.muted{fill:#9198a1}.strip{fill:#161b22;stroke:#3d444d}
    .send{fill:#2b1a4d;stroke:#bc8cff}.sendtx{fill:#d2a8ff}
    .recv{fill:#0c2d6b;stroke:#58a6ff}.recvtx{fill:#79c0ff}
    .key{fill:#3d2c00;stroke:#9e6a03}
    .bad{fill:#2d0f11;stroke:#f85149}.badtx{fill:#ff7b72}
    .ok{fill:#0f2916;stroke:#2ea043}.oktx{fill:#3fb950}
    .a{stroke:#6e7681}.fa{fill:#6e7681}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fa"/></marker></defs>

<text x="24" y="26" class="ink" font-size="14" font-weight="700">URL ของ webhook เป็นสาธารณะ — ใครก็ยิงได้ แล้วจะรู้ได้ไงว่ามาจากตัวจริง</text>

<!-- shared secret -->
<rect x="290" y="44" width="250" height="40" rx="8" class="key"/>
<text x="415" y="60" text-anchor="middle" class="ink" font-size="12" font-weight="600">🔑 secret ที่ทั้งสองฝ่ายรู้ (คนอื่นไม่รู้)</text>
<text x="415" y="77" text-anchor="middle" class="mono muted">whsec_test123</text>

<!-- sender -->
<rect x="24" y="100" width="360" height="140" rx="8" class="send"/>
<text x="44" y="124" class="sendtx" font-size="12.5" font-weight="700">ฝั่งส่ง (payment gateway)</text>
<text x="44" y="148" class="mono sendtx">body = '{"event":"paid","amount":50000}'</text>
<text x="44" y="168" class="mono sendtx">ts   = 1787755137</text>
<text x="44" y="192" class="mono sendtx">sig  = HMAC(secret, ts + "." + body)</text>
<rect x="44" y="202" width="320" height="28" rx="4" class="strip"/>
<text x="56" y="221" class="mono ink" font-size="10.5">X-Signature: 5257a869e7ec…</text>

<path d="M392 170 L436 170" class="a"/>

<!-- receiver -->
<rect x="446" y="100" width="360" height="140" rx="8" class="recv"/>
<text x="466" y="124" class="recvtx" font-size="12.5" font-weight="700">ฝั่งรับ (API ของคุณ)</text>
<text x="466" y="148" class="recvtx" font-size="11.5">คำนวณ HMAC เองจาก body ที่ได้รับ</text>
<text x="466" y="170" class="mono recvtx">expected = HMAC(secret, ts + "." + body)</text>
<rect x="466" y="182" width="320" height="48" rx="4" class="strip"/>
<text x="478" y="201" class="mono oktx" font-size="11">ตรงกัน   → มาจากตัวจริง แน่นอน ✓</text>
<text x="478" y="220" class="mono badtx" font-size="11">ไม่ตรง   → ปฏิเสธทันที ✗</text>

<path d="M340 88 L200 96" class="a"/>
<path d="M490 88 L630 96" class="a"/>

<!-- three traps -->
<text x="24" y="272" class="ink" font-size="13" font-weight="700">สามจุดที่พลาดกันบ่อยที่สุดตอนเขียนโค้ดตรวจ</text>

<rect x="24" y="284" width="254" height="120" rx="8" class="bad"/>
<text x="40" y="306" class="badtx" font-size="12" font-weight="600">1. ใช้ JSON ที่ parse แล้ว</text>
<text x="40" y="328" class="mono badtx" font-size="10.5">json.dumps(request.json)</text>
<text x="40" y="348" class="muted" font-size="11">{"a":1,"b":2} กับ {"b":2,"a":1}</text>
<text x="40" y="365" class="muted" font-size="11">ความหมายเท่ากัน แต่คนละ byte</text>
<text x="40" y="382" class="oktx" font-size="11" font-weight="600">→ ต้องใช้ raw body ที่รับมาดิบ ๆ</text>
<text x="40" y="398" class="mono oktx" font-size="10.5">request.get_data()</text>

<rect x="288" y="284" width="254" height="120" rx="8" class="bad"/>
<text x="304" y="306" class="badtx" font-size="12" font-weight="600">2. เทียบด้วย ==</text>
<text x="304" y="328" class="mono badtx" font-size="10.5">if expected == sig:</text>
<text x="304" y="348" class="muted" font-size="11">== หยุดทันทีที่เจอตัวต่างกัน</text>
<text x="304" y="365" class="muted" font-size="11">เวลาที่ใช้บอกใบ้ว่าเดาถูกกี่ตัว</text>
<text x="304" y="382" class="oktx" font-size="11" font-weight="600">→ ต้องเทียบแบบ constant-time</text>
<text x="304" y="398" class="mono oktx" font-size="10.5">hmac.compare_digest()</text>

<rect x="552" y="284" width="254" height="120" rx="8" class="bad"/>
<text x="568" y="306" class="badtx" font-size="12" font-weight="600">3. ไม่ตรวจ timestamp</text>
<text x="568" y="328" class="muted" font-size="11">ผู้โจมตีดัก request เก่าไว้</text>
<text x="568" y="345" class="muted" font-size="11">แล้วยิงซ้ำ — signature ยังถูกต้อง!</text>
<text x="568" y="362" class="muted" font-size="11">“เติมเงิน 1000” ซ้ำ 100 ครั้ง</text>
<text x="568" y="382" class="oktx" font-size="11" font-weight="600">→ ปฏิเสธถ้า ts เก่ากว่า 5 นาที</text>
<text x="568" y="398" class="muted" font-size="10.5">+ เก็บ event_id ไว้กันซ้ำ</text>

<!-- link -->
<rect x="24" y="414" width="782" height="30" rx="6" class="strip"/>
<text x="44" y="434" class="ink" font-size="12">กลไกเดียวกันนี้คือ <tspan font-weight="600">signature ใน ALTCHA challenge</tspan> (บทที่ 16) และเป็นหลักการเบื้องหลัง JWT, signed URL และ pagination cursor ที่แก้ไม่ได้</text>
</svg>

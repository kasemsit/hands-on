<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 430" width="100%" style="max-width:830px;height:auto" role="img" aria-label="เทคนิคลูกผสม ให้ Playwright login แล้วส่ง cookie ต่อให้ curl ยิงซ้ำ ๆ">
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
  .ink{fill:#1f2328}.muted{fill:#656d76}
  .strip{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
  .pw{fill:#fbefff;stroke:#8250df;stroke-width:1.5}.pwtx{fill:#6639ba}
  .cu{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}.cutx{fill:#0a4d8c}
  .jar{fill:#fff8c5;stroke:#d4a72c;stroke-width:1.5}
  .a{stroke:#8c959f;stroke-width:2.5;fill:none;marker-end:url(#a)}
  .fa{fill:#8c959f}
  @media (prefers-color-scheme:dark){
    .ink{fill:#e6edf3}.muted{fill:#9198a1}
    .strip{fill:#161b22;stroke:#3d444d}
    .pw{fill:#2b1a4d;stroke:#bc8cff}.pwtx{fill:#d2a8ff}
    .cu{fill:#0c2d6b;stroke:#58a6ff}.cutx{fill:#79c0ff}
    .jar{fill:#3d2c00;stroke:#9e6a03}
    .a{stroke:#6e7681}.fa{fill:#6e7681}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fa"/></marker></defs>

<text x="24" y="26" class="ink" font-size="14" font-weight="700">ให้ browser ทำส่วนที่ยาก แล้วให้ curl ทำส่วนที่ต้องทำซ้ำเยอะ ๆ</text>

<!-- playwright -->
<rect x="24" y="46" width="236" height="150" rx="8" class="pw"/>
<text x="142" y="70" text-anchor="middle" class="pwtx" font-size="13" font-weight="700">Playwright</text>
<text x="142" y="88" text-anchor="middle" class="pwtx" font-size="11.5">เปิด browser จริง · ทำครั้งเดียว</text>
<rect x="40" y="100" width="204" height="80" rx="6" class="strip"/>
<text x="54" y="120" class="ink" font-size="11.5">✓ รัน JavaScript ได้</text>
<text x="54" y="139" class="ink" font-size="11.5">✓ CSRF / cookie จัดการให้เอง</text>
<text x="54" y="158" class="ink" font-size="11.5">✓ ผ่าน CAPTCHA / login หลายขั้น</text>
<text x="54" y="176" class="muted" font-size="11">✗ ช้า 1-3 วิ · กิน RAM 100-300 MB</text>

<path d="M264 120 L306 120" class="a"/>

<!-- cookie jar -->
<rect x="310" y="46" width="210" height="150" rx="8" class="jar"/>
<text x="415" y="70" text-anchor="middle" class="ink" font-size="13" font-weight="700">cookie jar</text>
<text x="415" y="88" text-anchor="middle" class="muted" font-size="11.5">ไฟล์ Netscape format</text>
<rect x="324" y="100" width="182" height="62" rx="6" class="strip"/>
<text x="334" y="118" class="mono ink" font-size="10">#HttpOnly_127.0.0.1</text>
<text x="334" y="133" class="mono ink" font-size="10">FALSE  /  FALSE  0</text>
<text x="334" y="148" class="mono ink" font-size="10">sid  5661bc9f6a1c…</text>
<text x="415" y="180" text-anchor="middle" class="ink" font-size="11" font-weight="600">คั่นด้วย TAB เท่านั้น ห้ามใช้ space</text>

<path d="M524 120 L566 120" class="a"/>

<!-- curl -->
<rect x="570" y="46" width="236" height="150" rx="8" class="cu"/>
<text x="688" y="70" text-anchor="middle" class="cutx" font-size="13" font-weight="700">curl</text>
<text x="688" y="88" text-anchor="middle" class="cutx" font-size="11.5">ยิงกี่พันครั้งก็ได้</text>
<rect x="586" y="100" width="204" height="80" rx="6" class="strip"/>
<text x="600" y="120" class="ink" font-size="11.5">✓ เร็ว ~50 ms ต่อ request</text>
<text x="600" y="139" class="ink" font-size="11.5">✓ กิน RAM 2 MB</text>
<text x="600" y="158" class="mono ink" font-size="11">curl -b jar URL</text>
<text x="600" y="176" class="muted" font-size="11">✗ รัน JavaScript ไม่ได้</text>

<!-- conversion detail -->
<rect x="24" y="212" width="782" height="86" rx="8" class="strip"/>
<text x="44" y="234" class="ink" font-size="12.5" font-weight="700">จุดที่ต้องแปลง — Playwright กับ curl เก็บ cookie คนละรูปแบบ</text>
<text x="44" y="257" class="mono pwtx">Playwright: {"name":"sid", "value":"…", "expires":-1, "httpOnly":true}</text>
<text x="44" y="277" class="mono cutx">curl:       #HttpOnly_127.0.0.1⇥FALSE⇥/⇥FALSE⇥0⇥sid⇥…</text>
<text x="44" y="293" class="muted" font-size="10.5">ระวังสองจุด: expires -1 (session cookie ของ Playwright) ต้องกลายเป็น 0 · HttpOnly เป็น prefix หน้า domain ไม่ใช่คอลัมน์แยก</text>

<!-- when not to -->
<rect x="24" y="312" width="380" height="102" rx="8" class="strip"/>
<text x="42" y="334" class="ink" font-size="12.5" font-weight="600">ใช้วิธีนี้เมื่อ</text>
<text x="42" y="356" class="muted" font-size="11.5">• login ยาก แต่ทำครั้งเดียวแล้วอยู่ได้นาน</text>
<text x="42" y="375" class="muted" font-size="11.5">• ต้องยิง request ซ้ำ ๆ เยอะหลังจากนั้น</text>
<text x="42" y="394" class="muted" font-size="11.5">• ทดสอบ API ของตัวเองที่ login ผ่านหน้าเว็บ</text>

<rect x="426" y="312" width="380" height="102" rx="8" class="strip"/>
<text x="444" y="334" class="ink" font-size="12.5" font-weight="600">ใช้ไม่ได้เมื่อ</text>
<text x="444" y="356" class="muted" font-size="11.5">• ทุก request ต้องมี token ที่ JS คำนวณใหม่</text>
<text x="444" y="375" class="muted" font-size="11.5">• เว็บตรวจ TLS fingerprint (JA3)</text>
<text x="444" y="394" class="muted" font-size="11.5">• token อยู่ใน localStorage → ต้องดึงแยก</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 450" width="100%" style="max-width:830px;height:auto" role="img" aria-label="ปัญหา N+1 query เทียบกับ JOIN และผลของ index">
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
  .ink{fill:#1f2328}.muted{fill:#656d76}
  .strip{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
  .bad{fill:#ffebe9;stroke:#cf222e;stroke-width:1.5}.badtx{fill:#a40e26}
  .ok{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}.oktx{fill:#0f5323}
  .barbad{fill:#cf222e}.barok{fill:#1a7f37}
  .a{stroke:#cf222e;stroke-width:1.2;fill:none}
  .ag{stroke:#1a7f37;stroke-width:2;fill:none;marker-end:url(#g)}.fg{fill:#1a7f37}
  @media (prefers-color-scheme:dark){
    .ink{fill:#e6edf3}.muted{fill:#9198a1}.strip{fill:#161b22;stroke:#3d444d}
    .bad{fill:#2d0f11;stroke:#f85149}.badtx{fill:#ff7b72}
    .ok{fill:#0f2916;stroke:#2ea043}.oktx{fill:#3fb950}
    .barbad{fill:#f85149}.barok{fill:#2ea043}
    .a{stroke:#f85149}.ag{stroke:#2ea043}.fg{fill:#2ea043}
  }
</style>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg"/></marker></defs>

<text x="24" y="26" class="ink" font-size="14" font-weight="700">N+1 — บั๊กที่ ORM ทำให้เกิดง่ายที่สุด เพราะมันซ่อน query ไว้</text>

<!-- bad -->
<rect x="24" y="42" width="380" height="176" rx="8" class="bad"/>
<text x="42" y="66" class="badtx" font-size="12.5" font-weight="700">✗ 1 + 500 query</text>
<text x="42" y="88" class="mono badtx">orders = db.query("SELECT … LIMIT 500")</text>
<text x="42" y="106" class="mono badtx">for o in orders:</text>
<text x="42" y="124" class="mono badtx">    o.user = db.query("… WHERE id = ?")</text>
<text x="42" y="140" class="muted" font-size="10.5">                          ↑ ยิงใหม่ทุกรอบของลูป</text>
<!-- little bars -->
<rect x="42" y="152" width="6" height="14" class="barbad"/>
<g class="barbad">
<rect x="56" y="152" width="3" height="14"/><rect x="63" y="152" width="3" height="14"/><rect x="70" y="152" width="3" height="14"/>
<rect x="77" y="152" width="3" height="14"/><rect x="84" y="152" width="3" height="14"/><rect x="91" y="152" width="3" height="14"/>
<rect x="98" y="152" width="3" height="14"/><rect x="105" y="152" width="3" height="14"/><rect x="112" y="152" width="3" height="14"/>
<rect x="119" y="152" width="3" height="14"/><rect x="126" y="152" width="3" height="14"/><rect x="133" y="152" width="3" height="14"/>
<rect x="140" y="152" width="3" height="14"/><rect x="147" y="152" width="3" height="14"/><rect x="154" y="152" width="3" height="14"/>
<rect x="161" y="152" width="3" height="14"/><rect x="168" y="152" width="3" height="14"/><rect x="175" y="152" width="3" height="14"/>
<rect x="182" y="152" width="3" height="14"/><rect x="189" y="152" width="3" height="14"/><rect x="196" y="152" width="3" height="14"/>
<rect x="203" y="152" width="3" height="14"/><rect x="210" y="152" width="3" height="14"/><rect x="217" y="152" width="3" height="14"/>
<rect x="224" y="152" width="3" height="14"/><rect x="231" y="152" width="3" height="14"/><rect x="238" y="152" width="3" height="14"/>
<rect x="245" y="152" width="3" height="14"/><rect x="252" y="152" width="3" height="14"/><rect x="259" y="152" width="3" height="14"/>
</g>
<text x="272" y="164" class="muted" font-size="10.5">… อีก 470 ครั้ง</text>
<text x="42" y="188" class="badtx" font-size="11.5">แต่ละครั้งมี network round-trip ไป DB ~1 ms</text>
<text x="42" y="206" class="badtx" font-size="12" font-weight="600">→ ช้าเพิ่มอีกราว 500 ms ที่ผู้ใช้รู้สึกได้ทันที</text>

<!-- good -->
<rect x="426" y="42" width="380" height="176" rx="8" class="ok"/>
<text x="444" y="66" class="oktx" font-size="12.5" font-weight="700">✓ 1 query</text>
<text x="444" y="88" class="mono oktx">SELECT o.id, o.item, u.name</text>
<text x="444" y="106" class="mono oktx">FROM orders o</text>
<text x="444" y="124" class="mono oktx">JOIN users u ON u.id = o.user_id</text>
<rect x="444" y="152" width="6" height="14" class="barok"/>
<text x="462" y="164" class="muted" font-size="10.5">ครั้งเดียวจบ</text>
<text x="444" y="188" class="oktx" font-size="11.5">หรือใช้ eager loading ของ ORM:</text>
<text x="444" y="206" class="mono oktx">.select_related("user") / joinedload()</text>

<!-- how to catch -->
<rect x="24" y="234" width="782" height="56" rx="8" class="strip"/>
<text x="44" y="256" class="ink" font-size="12.5" font-weight="600">วิธีจับ N+1 ให้เจอ</text>
<text x="44" y="277" class="muted" font-size="11.5">เปิด query log ใน dev แล้วนับจำนวน query ต่อ 1 request — <tspan class="ink" font-weight="600">ถ้าจำนวน query โตตามจำนวนแถวที่ตอบกลับ นั่นคือ N+1</tspan> แล้วเขียนเทสต์ assert จำนวน query ใส่ CI ไว้กัน regression</text>

<!-- index -->
<text x="24" y="322" class="ink" font-size="14" font-weight="700">Index — ความต่างไม่ใช่ 2 เท่า แต่เป็นหลักร้อยเท่า</text>

<rect x="24" y="336" width="782" height="100" rx="8" class="strip"/>
<text x="44" y="358" class="badtx" font-size="11.5" font-weight="600">ไม่มี index (full scan)</text>
<rect x="200" y="346" width="520" height="18" rx="3" class="barbad"/>
<text x="732" y="360" class="mono badtx">345.0 ms</text>

<text x="44" y="388" class="oktx" font-size="11.5" font-weight="600">มี index (B-tree)</text>
<rect x="200" y="376" width="6" height="18" rx="3" class="barok"/>
<text x="732" y="390" class="mono oktx">1.3 ms</text>

<text x="44" y="416" class="muted" font-size="11.5">full scan โตแบบ <tspan class="mono ink">O(n)</tspan> — ข้อมูลเพิ่ม 10 เท่า ช้าลง 10 เท่า  ·  index โตแบบ <tspan class="mono ink">O(log n)</tspan> — ข้อมูลเพิ่ม 10 เท่า ช้าลงแทบไม่รู้สึก</text>
<text x="44" y="432" class="muted" font-size="11">ตัวเลขจริงจาก <tspan class="mono">python3 lab/db_demo.py</tspan> ที่ 50,000 แถว — ยิ่งข้อมูลเยอะ ช่องว่างยิ่งกว้าง</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 560" width="100%" style="max-width:830px;height:auto" role="img" aria-label="ขั้นตอนของ Proof of Work แบบ ALTCHA: ขอ challenge แก้โจทย์ ส่ง payload และ server ตรวจสามข้อ">
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
  .ink{fill:#1f2328}.muted{fill:#656d76}
  .strip{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
  .cli{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}.clitx{fill:#0a4d8c}
  .srv{fill:#fbefff;stroke:#8250df;stroke-width:1.5}.srvtx{fill:#6639ba}
  .work{fill:#fff8c5;stroke:#d4a72c;stroke-width:1.5}
  .ok{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}.oktx{fill:#0f5323}
  .a{stroke:#8c959f;stroke-width:2;fill:none;marker-end:url(#a)}
  .fa{fill:#8c959f}
  @media (prefers-color-scheme:dark){
    .ink{fill:#e6edf3}.muted{fill:#9198a1}
    .strip{fill:#161b22;stroke:#3d444d}
    .cli{fill:#0c2d6b;stroke:#58a6ff}.clitx{fill:#79c0ff}
    .srv{fill:#2b1a4d;stroke:#bc8cff}.srvtx{fill:#d2a8ff}
    .work{fill:#3d2c00;stroke:#9e6a03}
    .ok{fill:#0f2916;stroke:#2ea043}.oktx{fill:#3fb950}
    .a{stroke:#6e7681}.fa{fill:#6e7681}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fa"/></marker></defs>

<text x="24" y="24" class="ink" font-size="14" font-weight="700">Proof of Work — ทำให้การยิง request มี “ต้นทุน” ที่ต้องจ่ายด้วย CPU</text>

<!-- 1 -->
<rect x="24" y="42" width="150" height="34" rx="6" class="cli"/>
<text x="99" y="64" text-anchor="middle" class="clitx" font-size="12.5" font-weight="600">① ขอโจทย์</text>
<path d="M178 59 L228 59" class="a"/>
<rect x="232" y="38" width="574" height="88" rx="8" class="srv"/>
<text x="250" y="58" class="srvtx" font-size="12" font-weight="600">server สุ่ม N แล้วส่ง "ผลลัพธ์" มาให้ แต่ไม่บอก N</text>
<text x="250" y="80" class="mono srvtx">salt      = "a1b2c3?expires=1787755137"</text>
<text x="250" y="97" class="mono srvtx">challenge = sha256(salt + N)   ← เป้าหมายที่ต้องทำให้ได้</text>
<text x="250" y="114" class="mono srvtx">signature = HMAC(กุญแจลับของ server, challenge)</text>

<!-- 2 -->
<rect x="24" y="142" width="150" height="34" rx="6" class="cli"/>
<text x="99" y="164" text-anchor="middle" class="clitx" font-size="12.5" font-weight="600">② แก้โจทย์</text>
<path d="M178 159 L228 159" class="a"/>
<rect x="232" y="138" width="574" height="104" rx="8" class="work"/>
<text x="250" y="158" class="ink" font-size="12" font-weight="600">ไล่ลองตั้งแต่ 0 จนกว่า hash จะตรง — ไม่มีทางลัด นี่คือ “งาน” ที่ต้องจ่าย</text>
<text x="250" y="180" class="mono ink">sha256(salt + 0) → 4f2a…  ✗</text>
<text x="250" y="197" class="mono ink">sha256(salt + 1) → 9c81…  ✗</text>
<text x="250" y="214" class="mono muted">      … อีกหลายหมื่นครั้ง …</text>
<text x="250" y="232" class="mono oktx">sha256(salt + 4247) → ตรงกับ challenge  ✓  เจอแล้ว N = 4247</text>

<!-- 3 -->
<rect x="24" y="258" width="150" height="34" rx="6" class="cli"/>
<text x="99" y="280" text-anchor="middle" class="clitx" font-size="12.5" font-weight="600">③ ส่งคำตอบ</text>
<path d="M178 275 L228 275" class="a"/>
<rect x="232" y="254" width="574" height="72" rx="8" class="cli"/>
<text x="250" y="274" class="clitx" font-size="12" font-weight="600">payload = base64 ของ JSON — ไม่ใช่ JSON object ตรง ๆ</text>
<text x="250" y="296" class="mono clitx">{"algorithm","challenge","number":4247,"salt","signature"}</text>
<text x="250" y="316" class="mono clitx">→ ส่งเป็น  {"captcha": "eyJhbGdvcml0aG0iOiJTSEEt…"}</text>

<!-- 4 -->
<rect x="24" y="342" width="150" height="34" rx="6" class="srv"/>
<text x="99" y="364" text-anchor="middle" class="srvtx" font-size="12.5" font-weight="600">④ server ตรวจ</text>
<path d="M178 359 L228 359" class="a"/>

<rect x="232" y="338" width="184" height="86" rx="8" class="strip"/>
<text x="246" y="358" class="ink" font-size="11.5" font-weight="600">1. signature ถูกไหม</text>
<text x="246" y="378" class="muted" font-size="11">โจทย์นี้เราออกให้จริงหรือ</text>
<text x="246" y="396" class="muted" font-size="11">ผู้โจมตีสร้างเองมั่ว ๆ</text>
<text x="246" y="414" class="muted" font-size="11">(HMAC เซ็นเองไม่ได้)</text>

<rect x="428" y="338" width="184" height="86" rx="8" class="strip"/>
<text x="442" y="358" class="ink" font-size="11.5" font-weight="600">2. หมดอายุหรือยัง</text>
<text x="442" y="378" class="muted" font-size="11">ดูจาก ?expires= ใน salt</text>
<text x="442" y="400" class="muted" font-size="11">กันเอาโจทย์เก่ามาใช้</text>

<rect x="624" y="338" width="182" height="86" rx="8" class="strip"/>
<text x="638" y="358" class="ink" font-size="11.5" font-weight="600">3. N ถูกไหม</text>
<text x="638" y="378" class="muted" font-size="11">คำนวณ hash ครั้งเดียว</text>
<text x="638" y="400" class="muted" font-size="11">→ เร็วมาก</text>

<!-- asymmetry -->
<rect x="24" y="440" width="380" height="104" rx="8" class="ok"/>
<text x="44" y="464" class="oktx" font-size="12.5" font-weight="700">หัวใจคือความไม่สมมาตร</text>
<text x="44" y="488" class="oktx" font-size="11.5">แก้โจทย์: <tspan font-weight="600">ช้า</tspan> (ลองเป็นหมื่นครั้ง)</text>
<text x="44" y="507" class="oktx" font-size="11.5">ตรวจคำตอบ: <tspan font-weight="600">เร็วมาก</tspan> (hash ครั้งเดียว)</text>
<text x="44" y="530" class="muted" font-size="11">ผู้ใช้จริง 1 ครั้ง = 0.3 วิ · บอทยิงแสนครั้ง = 8 ชั่วโมง CPU</text>

<rect x="426" y="440" width="380" height="104" rx="8" class="work"/>
<text x="446" y="464" class="ink" font-size="12.5" font-weight="700">ทำไม signature ถึงขาดไม่ได้</text>
<text x="446" y="488" class="ink" font-size="11.5">ถ้าไม่มี ผู้โจมตีสร้าง challenge ง่าย ๆ เอง</text>
<text x="446" y="507" class="ink" font-size="11.5">ที่ N = 1 แล้วส่งมาให้ตรวจ → ผ่านทันที</text>
<text x="446" y="530" class="muted" font-size="11">PoW จะไร้ความหมายทั้งหมด — นี่คือหลักการจากบทที่ 13</text>
</svg>

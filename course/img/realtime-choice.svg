<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 440" width="100%" style="max-width:830px;height:auto" role="img" aria-label="แผนผังการเลือกวิธีสื่อสารแบบ real-time ระหว่าง polling SSE WebSocket และ push notification">
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
  .ink{fill:#1f2328}.muted{fill:#656d76}
  .strip{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
  .q{fill:#fff8c5;stroke:#d4a72c;stroke-width:1.5}
  .push{fill:#fbefff;stroke:#8250df;stroke-width:1.5}.pushtx{fill:#6639ba}
  .sse{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}.ssetx{fill:#0f5323}
  .ws{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}.wstx{fill:#0a4d8c}
  .a{stroke:#8c959f;stroke-width:2;fill:none;marker-end:url(#a)}.fa{fill:#8c959f}
  @media (prefers-color-scheme:dark){
    .ink{fill:#e6edf3}.muted{fill:#9198a1}.strip{fill:#161b22;stroke:#3d444d}
    .q{fill:#3d2c00;stroke:#9e6a03}
    .push{fill:#2b1a4d;stroke:#bc8cff}.pushtx{fill:#d2a8ff}
    .sse{fill:#0f2916;stroke:#2ea043}.ssetx{fill:#3fb950}
    .ws{fill:#0c2d6b;stroke:#58a6ff}.wstx{fill:#79c0ff}
    .a{stroke:#6e7681}.fa{fill:#6e7681}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fa"/></marker></defs>

<text x="24" y="26" class="ink" font-size="14" font-weight="700">เลือกยังไง — ตอบสองคำถามนี้ก็จบ</text>

<!-- q1 -->
<rect x="24" y="44" width="250" height="62" rx="8" class="q"/>
<text x="149" y="68" text-anchor="middle" class="ink" font-size="12.5" font-weight="600">แอปปิดอยู่ก็ต้องได้รับด้วยไหม?</text>
<text x="149" y="90" text-anchor="middle" class="muted" font-size="11">(ผู้ใช้ไม่ได้เปิดแอปค้างไว้)</text>

<path d="M278 62 L322 62" class="a"/>
<text x="286" y="56" class="ink" font-size="11" font-weight="600">ใช่</text>
<rect x="326" y="40" width="220" height="46" rx="8" class="push"/>
<text x="436" y="60" text-anchor="middle" class="pushtx" font-size="12.5" font-weight="700">Push (FCM / APNs)</text>
<text x="436" y="78" text-anchor="middle" class="pushtx" font-size="11">ไม่มีทางเลือกอื่น</text>

<path d="M149 110 L149 140" class="a"/>
<text x="158" y="128" class="ink" font-size="11" font-weight="600">ไม่</text>

<!-- q2 -->
<rect x="24" y="144" width="250" height="62" rx="8" class="q"/>
<text x="149" y="168" text-anchor="middle" class="ink" font-size="12.5" font-weight="600">client ต้องส่งข้อมูลกลับตลอดไหม?</text>
<text x="149" y="190" text-anchor="middle" class="muted" font-size="11">(สื่อสารสองทางจริง ๆ)</text>

<path d="M278 162 L322 162" class="a"/>
<text x="286" y="156" class="ink" font-size="11" font-weight="600">ใช่</text>
<rect x="326" y="140" width="220" height="46" rx="8" class="ws"/>
<text x="436" y="160" text-anchor="middle" class="wstx" font-size="12.5" font-weight="700">WebSocket</text>
<text x="436" y="178" text-anchor="middle" class="wstx" font-size="11">แชท · เกม · แก้เอกสารพร้อมกัน</text>

<path d="M149 210 L149 238" class="a"/>
<text x="158" y="228" class="ink" font-size="11" font-weight="600">ไม่</text>
<rect x="24" y="242" width="250" height="46" rx="8" class="sse"/>
<text x="149" y="262" text-anchor="middle" class="ssetx" font-size="12.5" font-weight="700">SSE</text>
<text x="149" y="280" text-anchor="middle" class="ssetx" font-size="11">feed · แจ้งเตือน · สถานะงาน</text>

<!-- why SSE -->
<rect x="326" y="204" width="480" height="84" rx="8" class="sse"/>
<text x="346" y="226" class="ssetx" font-size="12.5" font-weight="700">คนเลือก WebSocket บ่อยเกินความจำเป็น</text>
<text x="346" y="248" class="ssetx" font-size="11.5">ถ้าข้อมูลไหลทางเดียว SSE ง่ายกว่ามาก — วิ่งบน HTTP ปกติ ผ่าน proxy/CDN ได้</text>
<text x="346" y="266" class="ssetx" font-size="11.5">ใช้ header เดิม (รวม Authorization) มี auto-reconnect ในตัว</text>
<text x="346" y="284" class="ssetx" font-size="11.5">และ debug ด้วย <tspan class="mono">curl -N</tspan> ได้เลย ซึ่ง WebSocket ทำไม่ได้</text>

<!-- push payload warning -->
<rect x="24" y="306" width="782" height="120" rx="8" class="push"/>
<text x="44" y="330" class="pushtx" font-size="13" font-weight="700">⚠ เรื่องเดียวที่ห้ามพลาดเรื่อง push — payload ผ่านมือ Google/Apple และแสดงบนหน้าจอล็อก</text>

<rect x="44" y="342" width="360" height="70" rx="6" class="strip"/>
<text x="58" y="362" class="ink" font-size="11.5" font-weight="600">✗ บอกว่า “เกิดอะไรขึ้น”</text>
<text x="58" y="382" class="mono muted" font-size="10.5">{"body": "คุณโอน 50,000 บาท</text>
<text x="58" y="398" class="mono muted" font-size="10.5">          ให้ นายสมชาย ใจดี"}</text>

<rect x="426" y="342" width="360" height="70" rx="6" class="strip"/>
<text x="440" y="362" class="ink" font-size="11.5" font-weight="600">✓ บอกแค่ว่า “มีอะไรเกิดขึ้น”</text>
<text x="440" y="382" class="mono muted" font-size="10.5">{"body": "มีรายการใหม่",</text>
<text x="440" y="398" class="mono muted" font-size="10.5"> "data": {"type":"transfer","id":"tx_123"}}</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 470" width="100%" style="max-width:830px;height:auto" role="img" aria-label="X-Forwarded-For chain และวิธีอ่าน IP ผู้ใช้จริงเมื่ออยู่หลัง reverse proxy">
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
  .ink{fill:#1f2328}.muted{fill:#656d76}
  .strip{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
  .node{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5}
  .trust{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}.trusttx{fill:#0f5323}
  .untrust{fill:#ffebe9;stroke:#cf222e;stroke-width:1.5}.untrusttx{fill:#a40e26}
  .a{stroke:#8c959f;stroke-width:2;fill:none;marker-end:url(#a)}
  .fa{fill:#8c959f}
  .warn{fill:#fff8c5;stroke:#d4a72c;stroke-width:1.5}
  @media (prefers-color-scheme:dark){
    .ink{fill:#e6edf3}.muted{fill:#9198a1}
    .strip{fill:#161b22;stroke:#3d444d}.node{fill:#0d1117;stroke:#3d444d}
    .trust{fill:#0f2916;stroke:#2ea043}.trusttx{fill:#3fb950}
    .untrust{fill:#2d0f11;stroke:#f85149}.untrusttx{fill:#ff7b72}
    .a{stroke:#6e7681}.fa{fill:#6e7681}
    .warn{fill:#3d2c00;stroke:#9e6a03}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fa"/></marker></defs>

<text x="24" y="26" class="ink" font-size="14" font-weight="700">แอปของคุณเห็น IP ของ proxy ไม่ใช่ของผู้ใช้</text>

<!-- chain -->
<rect x="24" y="46" width="120" height="56" rx="8" class="node"/>
<text x="84" y="68" text-anchor="middle" class="ink" font-size="12" font-weight="600">ผู้ใช้</text>
<text x="84" y="88" text-anchor="middle" class="mono muted">203.0.113.9</text>

<path d="M148 74 L188 74" class="a"/>

<rect x="192" y="46" width="120" height="56" rx="8" class="node"/>
<text x="252" y="68" text-anchor="middle" class="ink" font-size="12" font-weight="600">Cloudflare</text>
<text x="252" y="88" text-anchor="middle" class="mono muted">70.41.3.18</text>

<path d="M316 74 L356 74" class="a"/>

<rect x="360" y="46" width="120" height="56" rx="8" class="trust"/>
<text x="420" y="68" text-anchor="middle" class="trusttx" font-size="12" font-weight="600">nginx (ของเรา)</text>
<text x="420" y="88" text-anchor="middle" class="mono trusttx">10.0.0.5</text>

<path d="M484 74 L524 74" class="a"/>

<rect x="528" y="46" width="120" height="56" rx="8" class="strip"/>
<text x="588" y="68" text-anchor="middle" class="ink" font-size="12" font-weight="600">app ของคุณ</text>
<text x="588" y="88" text-anchor="middle" class="muted" font-size="11">:8000</text>

<rect x="664" y="46" width="142" height="56" rx="8" class="untrust"/>
<text x="735" y="66" text-anchor="middle" class="untrusttx" font-size="11.5" font-weight="600">remote_addr</text>
<text x="735" y="84" text-anchor="middle" class="mono untrusttx">= 10.0.0.5</text>
<text x="735" y="98" text-anchor="middle" class="untrusttx" font-size="10">เหมือนกันหมดทุกคน!</text>

<!-- header -->
<rect x="24" y="122" width="782" height="70" rx="8" class="strip"/>
<text x="44" y="144" class="ink" font-size="12.5" font-weight="600">header ที่ได้มา — แต่ละ proxy ต่อท้ายเข้าไป</text>
<text x="44" y="170" class="mono ink" font-size="13">X-Forwarded-For: 203.0.113.9, 70.41.3.18</text>
<text x="44" y="186" class="muted" font-size="10.5">                 └── client ส่งมาแต่แรก ──┘  └─ Cloudflare เขียน ─┘</text>

<!-- danger -->
<rect x="24" y="204" width="380" height="112" rx="8" class="untrust"/>
<text x="42" y="228" class="untrusttx" font-size="12.5" font-weight="700">✗ อ่านตัวแรก = rate limit ตายสนิท</text>
<text x="42" y="250" class="mono untrusttx">ip = xff.split(",")[0]</text>
<rect x="42" y="260" width="344" height="46" rx="6" class="strip"/>
<text x="54" y="279" class="mono untrusttx" font-size="11">curl -H 'X-Forwarded-For: 1.2.3.4' …</text>
<text x="54" y="298" class="muted" font-size="11">ผู้โจมตีเปลี่ยน IP ปลอมทุกครั้ง → ยิงได้ไม่จำกัด</text>

<!-- correct -->
<rect x="426" y="204" width="380" height="112" rx="8" class="trust"/>
<text x="444" y="228" class="trusttx" font-size="12.5" font-weight="700">✓ ไล่จากขวามาซ้าย ข้าม proxy ที่เราเชื่อ</text>
<text x="444" y="250" class="mono trusttx">for ip in reversed(chain):</text>
<text x="444" y="267" class="mono trusttx">    if ip not in TRUSTED: return ip</text>
<rect x="444" y="276" width="344" height="32" rx="6" class="strip"/>
<text x="456" y="297" class="muted" font-size="11">เชื่อได้เฉพาะส่วนที่ proxy ของเราเขียนเองเท่านั้น</text>

<!-- rule -->
<rect x="24" y="330" width="782" height="52" rx="8" class="warn"/>
<text x="44" y="352" class="ink" font-size="12.5" font-weight="700">กฎ: ส่วนของ header ที่ proxy ของเราเขียน = เชื่อได้ · ส่วนที่ client ส่งมาแต่แรก = ปลอมได้ทั้งหมด</text>
<text x="44" y="372" class="ink" font-size="12">และถ้ายังยิงตรงเข้า app:8000 ได้อยู่ การตั้งค่าทั้งหมดนี้ไร้ผล — ต้อง bind 127.0.0.1 หรือใช้ security group ปิดไว้</text>

<!-- other headers -->
<rect x="24" y="394" width="782" height="62" rx="8" class="strip"/>
<text x="44" y="416" class="ink" font-size="12.5" font-weight="600">อีก header ที่ลืมแล้วเจ็บ: <tspan class="mono">X-Forwarded-Proto</tspan></text>
<text x="44" y="437" class="muted" font-size="11.5">proxy จบ TLS แล้วคุยกับแอปด้วย http → แอปเห็นว่าเป็น http เลย redirect ไป https → proxy รับ → ส่ง http ให้แอปอีก</text>
<text x="44" y="452" class="untrusttx" font-size="11.5" font-weight="600">= redirect loop ไม่รู้จบ ซึ่งเป็นสาเหตุอันดับหนึ่งของอาการ "เว็บเปิดไม่ขึ้นหลังตั้ง proxy"</text>
</svg>
